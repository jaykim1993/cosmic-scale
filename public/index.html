<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="태양계에서 관측 가능한 우주의 끝까지, 실제 관측 좌표와 거리로 배치한 로그 축척 3D 우주 지도">
<meta property="og:title" content="코스믹 스케일">
<meta property="og:description" content="태양계부터 관측 가능한 우주의 끝까지 — 실제 좌표 기반 로그 축척 3D 우주 지도">
<meta property="og:image" content="img/m31.jpg">
<style>[hidden]{display:none!important}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}img{max-width:100%}</style>
<title>코스믹 스케일</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbit&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: full-bleed WebGL scene; instruments float at the edges like an observatory console. Single dark look by choice. */
:root{
  --bg:#04060c;
  --panel:rgba(10,15,27,.84);
  --panel-solid:#0b111e;
  --line:rgba(140,165,210,.2);
  --fg:#e4eaf5;
  --muted:#8693ad;
  --accent:#f2c26a;
  --measure:#7fd3ff;
  --font-display:'Orbit','IBM Plex Sans KR',system-ui,sans-serif;
  --font-body:'IBM Plex Sans KR',system-ui,-apple-system,'Malgun Gothic',sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  --gl:max(16px, env(safe-area-inset-left, 0px));
  --gr:max(16px, env(safe-area-inset-right, 0px));
  --gt:calc(14px + env(safe-area-inset-top, 0px));
  --gb:calc(14px + env(safe-area-inset-bottom, 0px));
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);overflow:hidden;padding-left:var(--gl);padding-right:var(--gr)}
#app{position:fixed;inset:0;background:var(--bg)}
#app canvas{display:block;width:100%;height:100%;touch-action:none}
#labels{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.lbl{position:absolute;left:0;top:0;white-space:nowrap;font-size:12px;line-height:1;padding:3px 6px;border-radius:3px;color:var(--fg);text-shadow:0 0 4px #000,0 0 8px #000;pointer-events:auto;cursor:pointer;user-select:none;will-change:transform}
.lbl:hover{color:var(--accent)}
.lbl.sel{color:var(--accent);font-weight:600}
.lbl.ring{color:var(--muted);font-family:var(--font-mono);font-size:10.5px;pointer-events:none;letter-spacing:.02em}
.lbl small{color:var(--muted);font-size:10px;margin-left:4px}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
button{font:inherit;color:var(--fg);background:transparent;border:1px solid var(--line);border-radius:6px;padding:7px 11px;cursor:pointer;white-space:nowrap}
button:hover{border-color:rgba(242,194,106,.6)}
button:focus-visible,input:focus-visible,.rung:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.on{background:rgba(242,194,106,.14);border-color:var(--accent);color:var(--accent)}

#hud{position:fixed;top:var(--gt);left:var(--gl);max-width:min(360px,calc(100vw - 32px));padding:12px 14px;display:flex;flex-direction:column;gap:6px;pointer-events:none}
#hud h1{font-family:var(--font-display);font-weight:400;font-size:22px;letter-spacing:.04em;margin:0;line-height:1.1}
#hud .sub{color:var(--muted);font-size:12px}
#hud .read{font-family:var(--font-mono);font-size:11.5px;color:var(--fg);display:grid;grid-template-columns:auto 1fr;gap:2px 10px;margin-top:2px}
#hud .read span:nth-child(odd){color:var(--muted)}

#searchWrap{position:fixed;top:var(--gt);right:var(--gr);width:min(260px,calc(100vw - 32px));z-index:5}
#search{width:100%;box-sizing:border-box;font:inherit;font-size:13px;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:9px 12px}
#results{margin-top:6px;max-height:300px;overflow:auto;padding:4px}
#results div{padding:7px 9px;border-radius:5px;cursor:pointer;font-size:13px;display:flex;justify-content:space-between;gap:8px}
#results div:hover,#results div.hl{background:rgba(242,194,106,.12)}
#results small{color:var(--muted);font-family:var(--font-mono);font-size:11px}

#ladder{position:fixed;left:var(--gl);top:50%;transform:translateY(-38%);padding:8px 6px;display:flex;flex-direction:column;gap:1px;font-family:var(--font-mono);font-size:11px}
.rung{display:flex;align-items:center;gap:8px;padding:3px 8px 3px 4px;border-radius:4px;cursor:pointer;color:var(--muted)}
.rung:hover{color:var(--fg)}
.rung i{width:14px;height:1px;background:var(--line);display:block}
.rung.act{color:var(--accent)}
.rung.act i{background:var(--accent);width:22px}
.rung b{font-weight:400;font-family:var(--font-body);font-size:10.5px;opacity:.8}

#info{position:fixed;right:var(--gr);top:calc(var(--gt) + 56px);width:min(320px,calc(100vw - 32px));max-height:calc(100% - 200px);overflow:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
#info .cat{font-size:11px;letter-spacing:.08em;color:var(--accent);text-transform:uppercase}
#info h2{margin:0;font-family:var(--font-display);font-weight:400;font-size:24px;line-height:1.15;text-wrap:balance}
#info .en{color:var(--muted);font-size:13px;margin-top:-6px}
#info dl{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;margin:0;font-size:13px}
#info dt{color:var(--muted)}
#info dd{margin:0;font-family:var(--font-mono);font-variant-numeric:tabular-nums;font-size:12.5px}
#info p{margin:0;font-size:13.5px;line-height:1.6;color:#cdd5e4}
#info .row{display:flex;gap:8px;flex-wrap:wrap}
#info .note{font-size:11.5px;color:var(--muted);line-height:1.5}
#info .x{position:absolute;top:22px;right:22px;z-index:2;border:none;padding:4px 8px;color:var(--fg);background:rgba(4,6,12,.62);border-radius:999px}
#info figure.ph{margin:0;position:relative;aspect-ratio:1;width:100%;max-width:100%;border-radius:6px;overflow:hidden;background:#02030a;border:1px solid var(--line);flex:none}
#info figure.ph img{width:100%;height:100%;object-fit:cover;display:block}
#info .badge{position:absolute;left:8px;top:8px;font-size:10.5px;letter-spacing:.04em;padding:3px 8px;border-radius:999px;background:rgba(4,6,12,.72);color:var(--fg);border:1px solid var(--line)}
#info .badge.art{color:#ffcf96;border-color:rgba(255,207,150,.45)}
#info .badge.diagram,#info .badge.none{color:var(--measure);border-color:rgba(127,211,255,.4)}
#info .noimg{position:absolute;inset:0;background:radial-gradient(circle at 50% 46%,#fff 0,var(--c) 6%,transparent 24%),radial-gradient(circle at 50% 46%,var(--c) 0,transparent 55%),#02030a;opacity:.95}
#info .noimg.wide{background:radial-gradient(ellipse 40% 26% at 50% 46%,var(--c),transparent 70%),radial-gradient(circle at 30% 60%,var(--c),transparent 30%),#02030a;opacity:.55}
#info .noimg span{position:absolute;left:0;right:0;bottom:12px;text-align:center;font-size:11.5px;color:var(--muted)}
#info .credit{font-size:11px;color:var(--muted);margin-top:-4px;line-height:1.5}
#info .credit a{color:var(--muted)}
#info .credit a:hover{color:var(--fg)}
#info.measure .cat{color:var(--measure)}

#toolbar{display:flex;gap:8px;align-items:center;padding:8px;overflow-x:auto;box-sizing:border-box}
.seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;flex:none}
.seg button{border:none;border-radius:0;padding:7px 9px;font-size:12.5px}
.seg button+button{border-left:1px solid var(--line)}
.sep{width:1px;height:22px;background:var(--line);flex:none}
#toolbar>button{font-size:13px;flex:none}

#tour{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--gb) + var(--dockH,58px) + 8px);width:min(560px,calc(100vw - 32px));padding:14px 16px;display:flex;flex-direction:column;gap:10px}
#tour .step{font-family:var(--font-mono);font-size:11px;color:var(--accent);letter-spacing:.06em}
#tour h3{margin:0;font-family:var(--font-display);font-weight:400;font-size:19px}
#tour p{margin:0;font-size:14px;line-height:1.65;color:#d3dae7}
#tour .ctrl{display:flex;gap:8px;justify-content:flex-end;align-items:center}
#tour .bar{flex:1;height:2px;background:var(--line);border-radius:2px;overflow:hidden}
#tour .bar i{display:block;height:100%;width:0;background:var(--accent)}

#legend{position:fixed;left:var(--gl);bottom:var(--gb);font-size:11px;color:var(--muted);padding:9px 11px;display:flex;flex-direction:column;gap:5px;max-width:230px}
#legend .k{display:flex;flex-wrap:wrap;gap:4px 10px}
#legend .k span{display:flex;align-items:center;gap:5px}
#legend .k i{width:7px;height:7px;border-radius:50%;display:block}
#toast{position:fixed;left:50%;top:calc(var(--gt) + 4px);transform:translateX(-50%);padding:8px 14px;font-size:13px;color:var(--measure);border-color:rgba(127,211,255,.4)}

#dock{position:fixed;left:50%;transform:translateX(-50%);bottom:var(--gb);max-width:calc(100vw - 32px);box-sizing:border-box;display:flex;flex-direction:column;overflow:hidden}
#timeDrawer{display:grid;grid-template-rows:0fr;transition:grid-template-rows .42s cubic-bezier(.22,.9,.24,1)}
#dock.open #timeDrawer{grid-template-rows:1fr}
#timeInner{min-height:0;overflow:hidden}
#time{padding:10px 12px 12px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px;opacity:0;transform:translateY(-6px);transition:opacity .25s ease,transform .42s cubic-bezier(.22,.9,.24,1);visibility:hidden;transition-property:opacity,transform,visibility}
#dock.open #time{opacity:1;transform:none;visibility:visible;transition-delay:.06s,0s,0s}
#bTime{display:flex;align-items:center;gap:7px}
#bTime .car{display:inline-block;transition:transform .35s ease;font-size:10px;color:var(--muted)}
#dock.open #bTime .car{transform:rotate(180deg)}
#bTime .chip{padding:2px 6px;font-size:10px}
#time .tdate{display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap}
#simDate{font-family:var(--font-mono);font-size:14px;font-variant-numeric:tabular-nums;letter-spacing:.02em}
#simDelta{font-family:var(--font-mono);font-size:11px;color:var(--muted)}
.chip{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.06em;padding:3px 7px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.chip.live{color:#8ff0b8;border-color:rgba(143,240,184,.45)}
.chip.live::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:#8ff0b8;margin-right:5px;vertical-align:1px;animation:blink 1.6s infinite}
.chip.fwd{color:var(--accent);border-color:rgba(242,194,106,.5)}
.chip.rew{color:var(--measure);border-color:rgba(127,211,255,.5)}
@keyframes blink{50%{opacity:.25}}
#time .tbtns{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
#time .tbtns button{padding:5px 9px;font-size:12.5px}
#time select,#time input{font:inherit;font-size:12px;color:var(--fg);background:var(--panel-solid);border:1px solid var(--line);border-radius:6px;padding:5px 6px}
#tLive.on{color:#8ff0b8;border-color:rgba(143,240,184,.6);background:rgba(143,240,184,.1)}
@media (max-width:900px){#ladder{display:none}#legend{display:none}}
@media (max-width:640px){
  #hud{padding:10px 12px}
  #hud h1{font-size:18px}
  #hud .sub{display:none}
  #searchWrap{top:calc(var(--gt) + 90px);left:var(--gl);right:auto}
  #info figure.ph{width:150px}
  #info .x{top:12px;right:12px}
  #info{top:auto;bottom:calc(var(--gb) + var(--dockH,58px) + 8px);right:var(--gr);left:var(--gl);width:auto;max-height:44%}
  #tour{bottom:calc(var(--gb) + var(--dockH,58px) + 8px)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

</head>
<body>
<div id="app"></div>
<div id="labels"></div>

<div id="hud" class="panel">
  <h1>코스믹 스케일</h1>
  <div class="sub">태양에서 관측 가능한 우주의 끝까지 · 방향은 실제, 거리는 log₁₀ 축척</div>
  <div class="read">
    <span>시점 중심</span><span id="rdTarget">태양</span>
    <span>시야 축척</span><span id="rdCam">—</span>
  </div>
</div>

<div id="searchWrap">
  <input id="search" type="search" placeholder="천체 검색 (예: 안드로메다, Vega)" autocomplete="off" aria-label="천체 검색">
  <div id="results" class="panel" hidden></div>
</div>

<nav id="ladder" class="panel" aria-label="거리 축척 단계"></nav>

<aside id="info" class="panel" hidden></aside>

<div id="tour" class="panel" hidden>
  <div class="step" id="tStep"></div>
  <h3 id="tTitle"></h3>
  <p id="tText"></p>
  <div class="ctrl">
    <div class="bar"><i id="tBar"></i></div>
    <button id="tPrev" aria-label="이전 단계">이전</button>
    <button id="tPlay">일시정지</button>
    <button id="tNext" aria-label="다음 단계">다음</button>
    <button id="tClose">종료</button>
  </div>
</div>

<div id="legend" class="panel">
  <div class="k">
    <span><i style="background:#ffd27a"></i>태양·행성</span>
    <span><i style="background:#cfe0ff"></i>항성</span>
    <span><i style="background:#ff9ec7"></i>성운·성단</span>
    <span><i style="background:#c9b8ff"></i>은하</span>
    <span><i style="background:#8fe3c8"></i>은하단·구조</span>
    <span><i style="background:#ff7a6b"></i>블랙홀·퀘이사</span>
  </div>
  <div>은하수 원반·배경 은하 점들은 실제 분포를 본뜬 개념 모형입니다. 이름 붙은 천체는 실제 관측 좌표와 거리입니다.</div>
</div>

<div id="toast" class="panel" hidden></div>

<div id="dock" class="panel">
<div id="toolbar">
  <div class="seg" id="units" role="group" aria-label="거리 단위">
    <button data-u="auto" class="on">자동</button>
    <button data-u="ly">광년</button>
    <button data-u="pc">pc</button>
    <button data-u="AU">AU</button>
    <button data-u="km">km</button>
  </div>
  <div class="sep"></div>
  <button id="bTour">▶ 우주 투어</button>
  <button id="bMeasure">거리 측정</button>
  <button id="bLabels" class="on">라벨</button>
  <button id="bOrbits" class="on" aria-pressed="true">궤도</button>
  <button id="bRings" class="on" aria-pressed="true" title="태양 중심 거리 눈금 원">거리 눈금</button>
  <button id="bHome">전체 보기</button>
  <div class="sep"></div>
  <button id="bTime" aria-expanded="false" aria-controls="timeDrawer">시간 <span id="miniMode" class="chip live">LIVE</span><span class="car">▲</span></button>
</div>
<div id="timeDrawer"><div id="timeInner">
<div id="time" role="group" aria-label="시간 제어">
  <div class="tdate"><span id="simDate">—</span><span id="simDelta"></span><span id="simMode" class="chip live">LIVE</span></div>
  <div class="tbtns">
    <button id="tRew" title="과거로 빨리감기 (누를수록 빨라짐)" aria-label="과거로 빨리감기">⏪ 과거</button>
    <button id="tPause" aria-label="일시정지">⏸</button>
    <button id="tLive" class="on" title="현재 시각으로">● 실시간</button>
    <button id="tFwd" title="미래로 빨리감기 (누를수록 빨라짐)" aria-label="미래로 빨리감기">미래 ⏩</button>
    <select id="tSpeed" aria-label="빨리감기 속도"></select>
    <input id="tJump" type="date" min="0001-01-01" max="9999-12-31" aria-label="날짜로 이동">
  </div>
</div>
</div></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
<script>
(() => {
// ---------- scale model ----------
const LY_AU = 63241.077, LY_PC = 0.306601, LY_KM = 9.4607e12;
const D0 = 1e-6, A = 10;                       // r = 10·log10(1 + d / 1e-6 ly)
const f = d => A * Math.log10(1 + d / D0);
const finv = r => D0 * (Math.pow(10, r / A) - 1);
const DEG = Math.PI / 180;
const T = [[-0.0548755604,-0.8734370902,-0.4838350155],[0.4941094279,-0.4448296300,0.7469822445],[-0.8676661490,-0.1980763734,0.4559837762]];
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

function eqVec(ra, dec){ const a=ra*DEG, d=dec*DEG; return [Math.cos(d)*Math.cos(a), Math.cos(d)*Math.sin(a), Math.sin(d)]; }
function eqToThree(v){
  const g0=T[0][0]*v[0]+T[0][1]*v[1]+T[0][2]*v[2];
  const g1=T[1][0]*v[0]+T[1][1]*v[1]+T[1][2]*v[2];
  const g2=T[2][0]*v[0]+T[2][1]*v[1]+T[2][2]*v[2];
  return new THREE.Vector3(g0, g2, -g1);       // galactic plane = XZ, north galactic pole = +Y
}
const EPS = 23.4393*DEG;
function eclToThree(x,y,z){ return eqToThree([x, y*Math.cos(EPS)-z*Math.sin(EPS), y*Math.sin(EPS)+z*Math.cos(EPS)]); }
const EX=eclToThree(1,0,0), EY=eclToThree(0,1,0), EZ=eclToThree(0,0,1);
function orbXYZ(xp,yp,w,O,I){
  const cw=Math.cos(w),sw=Math.sin(w),cO=Math.cos(O),sO=Math.sin(O),cI=Math.cos(I),sI=Math.sin(I);
  return [(cw*cO-sw*sO*cI)*xp+(-sw*cO-cw*sO*cI)*yp, (cw*sO+sw*cO*cI)*xp+(-sw*sO+cw*cO*cI)*yp, sw*sI*xp+cw*sI*yp];
}
function keplerReal(el, rt, T, out){ // T: Julian centuries from J2000 → heliocentric position (ly)
  const Tc=Math.max(-30,Math.min(30,T));
  const a=el[0]+rt[0]*Tc, e=el[1]+rt[1]*Tc, I=(el[2]+rt[2]*Tc)*DEG, L=el[3]+rt[3]*T, wb=el[4]+rt[4]*Tc, Om=el[5]+rt[5]*Tc;
  const M=((((L-wb)%360)+540)%360-180)*DEG;
  let E=M+e*Math.sin(M); for(let k=0;k<10;k++) E-=(E-e*Math.sin(E)-M)/(1-e*Math.cos(E));
  const q=orbXYZ(a*(Math.cos(E)-e), a*Math.sqrt(1-e*e)*Math.sin(E), (wb-Om)*DEG, Om*DEG, I);
  return (out||new THREE.Vector3()).set(0,0,0).addScaledVector(EX,q[0]).addScaledVector(EY,q[1]).addScaledVector(EZ,q[2]).multiplyScalar(1/LY_AU);
}
function toScene(real){ const d=real.length(); return d===0 ? new THREE.Vector3() : real.clone().multiplyScalar(f(d)/d); }

// ---------- catalogue ----------
const CAT = {
  sun:{ko:'항성 · 우리 별',c:'#ffd27a',s:1.6}, planet:{ko:'행성',c:'#ffd27a',s:.75}, dwarf:{ko:'왜소행성',c:'#d9c49a',s:.55},
  probe:{ko:'탐사선',c:'#7fd3ff',s:.55}, region:{ko:'영역',c:'#9aa8c2',s:.5}, star:{ko:'항성',c:'#cfe0ff',s:.85},

function glowTex(){
  const c=document.createElement('canvas'); c.width=c.height=128; const g=c.getContext('2d');
  const r=g.createRadialGradient(64,64,0,64,64,64);
  r.addColorStop(0,'rgba(255,255,255,1)'); r.addColorStop(.12,'rgba(255,255,255,.95)'); r.addColorStop(.28,'rgba(255,255,255,.35)');
  r.addColorStop(.6,'rgba(255,255,255,.06)'); r.addColorStop(1,'rgba(255,255,255,0)');
  g.fillStyle=r; g.fillRect(0,0,128,128); return new THREE.CanvasTexture(c);
}
function ringTex(){
  const c=document.createElement('canvas'); c.width=c.height=128; const g=c.getContext('2d');
  g.strokeStyle='rgba(255,255,255,.95)'; g.lineWidth=5; g.beginPath(); g.arc(64,64,52,0,Math.PI*2); g.stroke();
  return new THREE.CanvasTexture(c);
}

function cloud(positions, colors, size, opacity){
  const g=new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(positions,3));
  g.setAttribute('color', new THREE.Float32BufferAttribute(colors,3));

}
let seed=7; const rnd=()=>{seed=(seed*16807)%2147483647;return (seed-1)/2147483646;};
const gauss=()=>{let u=0,v=0;while(!u)u=rnd();while(!v)v=rnd();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);};
function pushReal(arr, carr, v, c){ const d=v.length(); if(!d) return; const s=v.multiplyScalar(f(d)/d); arr.push(s.x,s.y,s.z); carr.push(c.r,c.g,c.b); }

// Milky Way model (galactic coords, heliocentric; GC at +x 26,670 ly)
(() => {
  const P=[],C=[],R0=26670, pitch=12.5*DEG;
  const cArm=new THREE.Color('#b9cbff'), cOld=new THREE.Color('#ffe2b0'), cHii=new THREE.Color('#ff9ec7');
  for(let i=0;i<26000;i++){
    let gx,gy,gz,c;
    const t=rnd();
    if(t<.18){ // bulge + bar
      const bar=28*DEG, L=gauss()*(t<.1?3500:6500), W=gauss()*1800;
      gx=L*Math.cos(bar)-W*Math.sin(bar); gy=L*Math.sin(bar)+W*Math.cos(bar); gz=gauss()*1400; c=cOld;
    } else {
      const r=Math.min(50000, 4000 + -Math.log(1-rnd()*.995)*9000);
      const arm=Math.floor(rnd()*4);
      const th=Math.log(r/4000)/Math.tan(pitch) + arm*Math.PI/2 + gauss()*.22;
      gx=r*Math.cos(th); gy=r*Math.sin(th); gz=gauss()*(260+r*.004);
      c = rnd()<.04 ? cHii : (rnd()<.45 ? cOld : cArm);
    }
    // to heliocentric: Sun at (-R0,0,+65) in GC frame with x pointing Sun→GC
    const v=new THREE.Vector3(gx+R0, gz-65, -gy);
    if(v.length()<900) continue;
    pushReal(P,C,v,c);
  }
  cloud(P,C,1.6,.55);
})();
// Magellanic clouds
(() => {
  const P=[],C=[]; const col=new THREE.Color('#d6caff');
  [['lmc',7000,2200],['smc',3500,1400]].forEach(([id,rad,n])=>{
    const ctr=byId[id].real; for(let i=0;i<n;i++){ const v=new THREE.Vector3(gauss(),gauss()*.5,gauss()).multiplyScalar(rad*.5).add(ctr); pushReal(P,C,v,col);} });
  cloud(P,C,1.3,.45);
})();

const belt={a:[],L:[],z:[],points:null};
(() => {
  const P=[],C=[]; const ca=new THREE.Color('#bfae8f'), ck=new THREE.Color('#9fb7d6'), co=new THREE.Color('#7f93b8');
  const BP=[],BC=[];
  for(let i=0;i<3200;i++){ const ast=i<1400, a=ast?2.2+rnd()*1.1:30+rnd()*20; belt.a.push(a); belt.L.push(rnd()*Math.PI*2); belt.z.push(gauss()*(ast?.12:3)); const c=ast?ca:ck; BP.push(0,0,0); BC.push(c.r,c.g,c.b); }
  belt.points=cloud(BP,BC,1.4,.5);
  for(let i=0;i<3000;i++){ const r=Math.pow(10, Math.log10(2000)+rnd()*(Math.log10(100000)-Math.log10(2000))); const v=new THREE.Vector3(gauss(),gauss(),gauss()).normalize().multiplyScalar(r/LY_AU); pushReal(P,C,v,co); }
  cloud(P,C,1.4,.5);
})();
// background galaxy field (concept: clumpy distribution 100 Mly – 44 Gly)
(() => {
  const P=[],C=[]; const cs=[new THREE.Color('#c9b8ff'),new THREE.Color('#ffd9b0'),new THREE.Color('#9fd0ff')];
  for(let k=0;k<420;k++){
    const r=Math.pow(10, 8+rnd()*2.64), dir=new THREE.Vector3(gauss(),gauss(),gauss()).normalize();
    const n=6+Math.floor(rnd()*22), spread=r*.12;
    for(let i=0;i<n;i++){ const v=dir.clone().multiplyScalar(r).add(new THREE.Vector3(gauss(),gauss(),gauss()).multiplyScalar(spread)); pushReal(P,C,v,cs[i%3]); }
  }
  cloud(P,C,1.2,.4);
})();

// ---------- formatting ----------
let unit='auto';
const trim=x=>{ if(x>=100) return Math.round(x).toLocaleString('ko-KR'); if(x>=10) return String(+x.toFixed(1)); if(x>=1) return String(+x.toFixed(2)); return String(+x.toPrecision(3)); };
function kfmt(n){
  const a=Math.abs(n);
  if(a>=1e16){ const e=Math.floor(Math.log10(a)); return `${trim(n/10**e)}×10^${e}`.replace(/\^(\d+)/,(m,p)=>p.split('').map(c=>'⁰¹²³⁴⁵⁶⁷⁸⁹'[c]).join('')); }
  if(a>=1e12) return trim(n/1e12)+'조'; if(a>=1e8) return trim(n/1e8)+'억'; if(a>=1e4) return trim(n/1e4)+'만'; return trim(n);
}
function fmtDist(ly, u=unit){
  if(ly===0) return '0';
  if(u==='auto') u = ly<0.05 ? 'AU' : 'ly';
  if(u==='ly') return kfmt(ly)+' 광년';
  if(u==='pc') return kfmt(ly*LY_PC)+' pc';
  if(u==='AU') return kfmt(ly*LY_AU)+' AU';
  return kfmt(ly*LY_KM)+' km';
}
function fmtLight(ly){
  if(ly>=1) return kfmt(ly)+'년';
  const min=ly*525960; if(min<60) return trim(min)+'분';
  const h=min/60; if(h<48) return trim(h)+'시간'; return trim(h/24)+'일';
}
const raStr=ra=>{ const h=ra/15, hh=Math.floor(h), mm=Math.round((h-hh)*60); return `${hh}h ${String(mm).padStart(2,'0')}m`; };
const decStr=d=>`${d>=0?'+':'−'}${Math.abs(d).toFixed(1)}°`;

// ---------- camera flights ----------
let fly=null, targetObj=null;
function flyTo(target, dist, dur=1900, dirOverride){
  const fromT=controls.target.clone(), fromDir=camera.position.clone().sub(fromT), fromDist=fromDir.length(); fromDir.normalize();
  let toDir=dirOverride ? dirOverride.clone().normalize() : fromDir.clone();
  fly={t0:performance.now(),dur:reduceMotion?1:dur,fromT,toT:target.clone(),fromDir,toDir,fromDist,toDist:dist};
}
function viewDistFor(o){
  if(o.id==='sun') return 30;
  if(o.cat==='planet'||o.cat==='dwarf') return 3.2;
  if(o.cat==='cmb') return 60;
  if(o.d>1e8) return 7; if(o.d>1e5) return 5; return 3.5;
}
function niceDir(o){ // look from the Sun side, slightly above the plane
  const out=o.pos.clone().normalize(); if(!out.lengthSq()) return new THREE.Vector3(0,.5,1);
  const side=new THREE.Vector3(0,1,0).cross(out).normalize();
  return out.multiplyScalar(-.55).add(side.multiplyScalar(.7)).add(new THREE.Vector3(0,.45,0));
}
function flyToObj(o, dur){ targetObj=o; selected=o; renderInfo(); flyTo(o.pos, viewDistFor(o), dur, niceDir(o)); }
function flyToScale(d, dur){ targetObj=null; const dir=camera.position.clone().sub(controls.target).normalize(); dir.y=Math.max(dir.y,.35); flyTo(new THREE.Vector3(), Math.max(1.2,f(d)*1.7), dur, dir); }
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
function stepFly(now){
  if(!fly) return;
  const t=Math.min(1,(now-fly.t0)/fly.dur), e=ease(t);
  const tg=fly.fromT.clone().lerp(fly.toT,e);
  const dir=fly.fromDir.clone().lerp(fly.toDir,e).normalize();
  const dist=Math.exp(Math.log(fly.fromDist)*(1-e)+Math.log(fly.toDist)*e);
  controls.target.copy(tg); camera.position.copy(tg).add(dir.multiplyScalar(dist));
  if(t>=1) fly=null;
}

const v3=new THREE.Vector3();
function screenOf(p){ v3.copy(p).project(camera); return {x:(v3.x+1)/2*innerWidth, y:(1-v3.y)/2*innerHeight, z:v3.z}; }
let downAt=null;
renderer.domElement.addEventListener('pointerdown',e=>{ downAt={x:e.clientX,y:e.clientY,t:performance.now()}; });
renderer.domElement.addEventListener('pointerup',e=>{
  if(!downAt) return; const moved=Math.hypot(e.clientX-downAt.x,e.clientY-downAt.y); downAt=null; if(moved>6) return;
  let best=null,bd=24;
  objects.forEach(o=>{ if(o.hidden) return; const s=screenOf(o.pos); if(s.z>1) return; const d=Math.hypot(s.x-e.clientX,s.y-e.clientY); if(d<bd){bd=d;best=o;} });
  if(best) pick(best);
});
renderer.domElement.addEventListener('dblclick',e=>{
  let best=null,bd=24;
  objects.forEach(o=>{ const s=screenOf(o.pos); if(s.z>1) return; const d=Math.hypot(s.x-e.clientX,s.y-e.clientY); if(d<bd){bd=d;best=o;} });
  if(best) flyToObj(best);
});

// ---------- tour ----------
const STEPS=[
  {o:'earth',h:'출발: 지구',p:'이 지도는 태양을 중심에 두고 모든 천체를 실제 하늘 방향에 놓았습니다. 대신 거리는 로그로 압축해서, 바깥으로 한 눈금 갈 때마다 10배씩 멀어집니다.'},
  {s:40/LY_AU,h:'태양계',p:'해왕성까지 약 30 AU, 빛으로 4시간 남짓입니다. 행성들은 오늘 날짜의 대략적인 위치에 있고, 황도면은 은하면에 대해 약 60° 기울어 있습니다.'},
  {o:'voyager1',h:'보이저 1호',p:'인류가 만든 가장 먼 물체. 2026년 11월 무렵 지구에서 빛으로 꼬박 하루, 약 173 AU 떨어진 지점에 닿습니다.'},
  {s:1.6,h:'오르트 구름',p:'장주기 혜성이 오는 곳으로 추정되는 얼음 천체 구름. 태양 중력이 미치는 범위가 1.5광년 안팎까지 이어집니다.'},
  {o:'proxima',h:'가장 가까운 별',p:'프록시마 센타우리, 4.24광년. 지금 보는 이 별빛은 4년 3개월 전에 출발했습니다. 보이저 1호 속도로는 약 7만 년이 걸립니다.'},
  {s:60,h:'태양의 이웃',p:'시리우스, 프로키온, 베가, 알타이르. 밤하늘의 밝은 별 상당수는 수십 광년 안에 있습니다. 직녀와 견우는 서로 약 15광년 떨어져 있습니다.'},
  {o:'orion',h:'오리온 대성운',p:'약 1,344광년. 지금도 별이 태어나고 있는 가장 가까운 대형 성운입니다. 근처의 베텔게우스, 리겔과 거리를 비교해 보세요.'},
  {o:'sgra',h:'우리은하의 중심',p:'궁수자리 A*. 태양 질량 약 430만 배의 블랙홀이 2만 6,700광년 거리에 있습니다. 태양은 이 주위를 약 2억 3천만 년에 한 바퀴 돕니다.'},
  {s:1.5e5,h:'우리은하',p:'지름 약 10만 광년, 별 1,000억~4,000억 개. 로그 축척이라 태양 근처 원반이 넓게 펼쳐지고 먼 쪽은 압축되어, 은하수가 띠 모양 고리로 보입니다.'},
  {o:'lmc',h:'대마젤란은하',p:'16만 광년. 우리은하를 도는 가장 밝은 위성은하입니다.'},
  {o:'m31',h:'안드로메다은하',p:'약 254만 광년. 맨눈으로 보이는 가장 먼 천체 중 하나이며, 우리은하와 함께 국부은하군을 이끕니다.'},
  {o:'virgo',h:'처녀자리 은하단',p:'약 5,400만 광년, 은하 1,000개 이상. 중심의 M87 블랙홀은 2019년 처음으로 그림자가 촬영되었습니다.'},
  {o:'laniakea',h:'라니아케아 초은하단',p:'우리가 속한 지름 약 5억 2천만 광년의 은하 흐름. 은하들이 중심부의 거대 인력체 쪽으로 움직입니다.'},
  {o:'3c273',h:'퀘이사 3C 273',p:'약 20억 년 전에 출발한 빛. 이 거리부터는 우주 팽창 때문에 \'거리\'를 정의하는 방법이 여러 가지가 됩니다. 이 모형은 공동거리를 씁니다.'},
  {o:'jades14',h:'가장 먼 은하들',p:'JADES-GS-z14-0. 빅뱅 후 약 2억 9천만 년의 모습입니다. 빛은 135억 년을 달려왔지만, 그 은하는 지금 약 335억 광년 떨어져 있습니다.'},
  {s:9e10,h:'관측 가능한 우주',p:'바깥 껍질은 우주 마이크로파 배경(CMB), 빅뱅 38만 년 뒤의 빛입니다. 관측 가능한 우주의 반지름은 약 465억 광년. 우리는 언제나 이 구의 정중앙에 있습니다.'}
];
const tourEl=document.getElementById('tour'), tBar=document.getElementById('tBar'), tPlay=document.getElementById('tPlay');
const tour={on:false,i:0,playing:true,t0:0,dur:9000};
function showStep(i){
  tour.i=(i+STEPS.length)%STEPS.length; const s=STEPS[tour.i];
  document.getElementById('tStep').textContent=`${String(tour.i+1).padStart(2,'0')} / ${STEPS.length}`;
  document.getElementById('tTitle').textContent=s.h; document.getElementById('tText').textContent=s.p;
  if(s.o) flyToObj(byId[s.o],2600); else { selected=null; renderInfo(); flyToScale(s.s,2600); }
  tour.t0=performance.now();
}
function setPlaying(p){ tour.playing=p; tPlay.textContent=p?'일시정지':'재생'; tour.t0=performance.now()-(p?0:0); }
function startTour(){ tour.on=true; tourEl.hidden=false; setMeasure(false); setPlaying(!reduceMotion); showStep(0); document.getElementById('bTour').classList.add('on'); }
function stopTour(){ tour.on=false; tourEl.hidden=true; document.getElementById('bTour').classList.remove('on'); }
document.getElementById('bTour').onclick=()=>tour.on?stopTour():startTour();
document.getElementById('tNext').onclick=()=>showStep(tour.i+1);
document.getElementById('tPrev').onclick=()=>showStep(tour.i-1);
document.getElementById('tClose').onclick=stopTour;
tPlay.onclick=()=>setPlaying(!tour.playing);

// ---------- readout ----------
const rdT=document.getElementById('rdTarget'), rdC=document.getElementById('rdCam');
let lastR=-1;
function updateReadout(force){
  const r=camera.position.distanceTo(controls.target)+controls.target.length()*1000;
  if(!force && Math.abs(r-lastR)<.02) return; lastR=r;
  const tr=controls.target.length();
  const cd=camera.position.distanceTo(controls.target);
  rdC.textContent = tr<.01 ? `반경 ≈ ${fmtDist(finv(cd/1.7))}까지` : `주변 ±${(cd/A).toFixed(1)} 자릿수(10ⁿ배)`;
  rdT.textContent = targetObj && controls.target.distanceTo(targetObj.pos)<.01 ? targetObj.ko : (tr<.01?'태양':`태양에서 ≈ ${fmtDist(finv(tr))}`);
  const focus=Math.max(tr, cd/1.7); let best=null,bd=1e9;
  RUNGS.forEach(g=>{ const d=Math.abs(f(g.d)-focus); if(d<bd){bd=d;best=g;} g.rung.classList.remove('act'); });
  best.rung.classList.add('act');
}

// ---------- simulated time ----------
const SPEEDS=[['1분/초',60],['1시간/초',3600],['1일/초',86400],['1주/초',604800],['1개월/초',2629800],['1년/초',31557600],['10년/초',315576000],['100년/초',3155760000],['1천 년/초',31557600000],['1만 년/초',315576000000]];
const MINMS=Date.UTC(-98000,0,1), MAXMS=Date.UTC(102000,0,1), J2000=Date.UTC(2000,0,1,12), YR=365.25*864e5;
const sim={ms:Date.now(),live:true,paused:false,dir:1,idx:2,last:0,lastApplied:NaN};
const pad=n=>String(n).padStart(2,'0');
function yearStr(y){ return y<=0?`기원전 ${(1-y).toLocaleString('ko-KR')}`:(y>9999?y.toLocaleString('ko-KR'):String(y)); }
function fmtSim(ms){ const d=new Date(ms); return `${yearStr(d.getFullYear())}년 ${pad(d.getMonth()+1)}월 ${pad(d.getDate())}일 ${pad(d.getHours())}:${pad(d.getMinutes())}`; }
function fmtSimShort(ms){ const d=new Date(ms); return `${yearStr(d.getFullYear())}.${pad(d.getMonth()+1)}.${pad(d.getDate())}`; }
const tSpeed=document.getElementById('tSpeed');
tSpeed.innerHTML=SPEEDS.map((s,i)=>`<option value="${i}">${s[0]}</option>`).join(''); tSpeed.value=sim.idx;
const simDate=document.getElementById('simDate'), simMode=document.getElementById('simMode'), simDelta=document.getElementById('simDelta');
const miniMode=document.getElementById('miniMode'), dock=document.getElementById('dock'), bTime=document.getElementById('bTime');
bTime.onclick=()=>{ const o=dock.classList.toggle('open'); bTime.setAttribute('aria-expanded',o); bTime.classList.toggle('on',o); };
new ResizeObserver(()=>document.documentElement.style.setProperty('--dockH',dock.offsetHeight+'px')).observe(dock);
const tLive=document.getElementById('tLive'), tPause=document.getElementById('tPause');
function syncTimeUI(){
  tLive.classList.toggle('on',sim.live); tPause.textContent=(!sim.live&&sim.paused)?'▶':'⏸'; tPause.setAttribute('aria-label',(!sim.live&&sim.paused)?'재생':'일시정지');
  tSpeed.value=sim.idx;
  simMode.className='chip '+(sim.live?'live':sim.paused?'':sim.dir>0?'fwd':'rew');
  miniMode.className=simMode.className; miniMode.textContent=sim.live?'LIVE':sim.paused?'정지':(sim.dir>0?'▸ '+SPEEDS[sim.idx][0]:'◂ '+SPEEDS[sim.idx][0]);
  simMode.textContent=sim.live?'LIVE':sim.paused?'정지':(sim.dir>0?`미래 ▸ ${SPEEDS[sim.idx][0]}`:`◂ 과거 ${SPEEDS[sim.idx][0]}`);
}
function ff(dir){
  if(!sim.live && !sim.paused && sim.dir===dir) sim.idx=Math.min(SPEEDS.length-1,sim.idx+1);
  sim.live=false; sim.paused=false; sim.dir=dir; syncTimeUI();
}
document.getElementById('tFwd').onclick=()=>ff(1);
document.getElementById('tRew').onclick=()=>ff(-1);
tLive.onclick=()=>{ sim.live=true; sim.paused=false; sim.ms=Date.now(); syncTimeUI(); };
tPause.onclick=()=>{ if(sim.live){ sim.live=false; sim.paused=true; } else sim.paused=!sim.paused; syncTimeUI(); };
tSpeed.onchange=()=>{ sim.idx=+tSpeed.value; if(sim.live){ sim.live=false; sim.dir=1; } sim.paused=false; syncTimeUI(); };
document.getElementById('tJump').onchange=e=>{ if(!e.target.value) return; const [y,m,d]=e.target.value.split('-').map(Number); const dt=new Date(2000,m-1,d,12); dt.setFullYear(y); sim.ms=dt.getTime(); sim.live=false; sim.paused=true; syncTimeUI(); };

const tmpV=new THREE.Vector3();
function placeObj(o){
  const old=o.pos.clone();
  o.d=o.real.length(); o.pos=toScene(o.real); o.sprite.position.copy(o.pos);
  if(o===targetObj && !fly){ tmpV.copy(o.pos).sub(old); controls.target.add(tmpV); camera.position.add(tmpV); }
}
function applySim(ms){
  if(ms===sim.lastApplied) return; sim.lastApplied=ms;
  const yrs=(ms-J2000)/YR, yr=2000+yrs;
  objects.forEach(o=>{
    if(o.kel){ keplerReal(o.kel,o.rt,yrs/100,o.real); placeObj(o); }
    else if(o.vel){ o.real.copy(o.real0).addScaledVector(o.vel,yrs); placeObj(o); }
    else if(o.dir){ const au=o.au0+o.auYr*(yr-2026.85); o.hidden=au<5; o.sprite.visible=!o.hidden; if(!o.hidden){ o.real.copy(o.dir).multiplyScalar(au/LY_AU); placeObj(o); } }
  });
  const pa=belt.points.geometry.attributes.position, arr=pa.array;
  for(let i=0;i<belt.a.length;i++){
    const a=belt.a[i], L=belt.L[i]+2*Math.PI*yrs/Math.pow(a,1.5), x=a*Math.cos(L), y=a*Math.sin(L), z=belt.z[i];
    const rx=(EX.x*x+EY.x*y+EZ.x*z)/LY_AU, ry=(EX.y*x+EY.y*y+EZ.y*z)/LY_AU, rz=(EX.z*x+EY.z*y+EZ.z*z)/LY_AU;
    const d=Math.hypot(rx,ry,rz), k=f(d)/d; arr[i*3]=rx*k; arr[i*3+1]=ry*k; arr[i*3+2]=rz*k;
  }
  pa.needsUpdate=true;
  if(mPair) measureLine.geometry.setFromPoints([mPair[0].pos,mPair[1].pos]);
}
let lastInfo=0, lastClock='';
function tickSim(now){
  const dt=Math.min(.1,(now-(sim.last||now))/1000); sim.last=now;
  if(sim.live) sim.ms=Date.now();
  else if(!sim.paused){
    sim.ms+=sim.dir*SPEEDS[sim.idx][1]*1000*dt;
    if(sim.ms<MINMS||sim.ms>MAXMS){ sim.ms=Math.max(MINMS,Math.min(MAXMS,sim.ms)); sim.paused=true; syncTimeUI(); toast('시뮬레이션 범위(약 ±10만 년) 끝에 도달했습니다',3000); }
  }
  applySim(sim.ms);
  const c=fmtSim(sim.ms); if(c!==lastClock){ lastClock=c; simDate.textContent=c;
    const dy=(sim.ms-Date.now())/YR; simDelta.textContent=sim.live?'':(Math.abs(dy)<1/365?'현재':`현재${dy>0?'+':'−'}${Math.abs(dy)<1?trim(Math.abs(dy)*365.25)+'일':kfmt(Math.abs(dy))+'년'}`); }
  if(now-lastInfo>250 && !info.hidden){ lastInfo=now; const dl=document.getElementById('infoDl');
    if(dl){ if(mPair) dl.innerHTML=measureRows(mPair[0],mPair[1]); else if(selected) dl.innerHTML=infoRows(selected); } }
}

// ---------- frame ----------
function overlaps(a,list){ for(const b of list){ if(a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y) return true; } return false; }
function frame(now){
  tickSim(now);
  stepFly(now);
  controls.update();
  if(tour.on){
    if(tour.playing && !fly){ const p=(now-tour.t0)/tour.dur; tBar.style.width=Math.min(100,p*100)+'%'; if(p>=1) showStep(tour.i+1); }
    else if(fly) tour.t0=now;
  }
  const cp=camera.position;
  objects.forEach(o=>{ const dc=cp.distanceTo(o.pos); o.dc=dc; o.sprite.scale.setScalar(Math.max(dc*.022*o.size,1e-4)); });
  if(selected){ selRing.visible=true; selRing.position.copy(selected.pos); selRing.scale.setScalar(selected.dc*.06); } else selRing.visible=false;
  renderer.render(scene,camera);

  // labels with priority + collision
  const placed=[];
  const cand=[];
  if(showLabels){
    objects.forEach(o=>{
      if(o.hidden){ o.el.style.display='none'; return; }
      const s=screenOf(o.pos); o.scr=s;
      if(s.z>1||s.x<-50||s.x>innerWidth+50||s.y<-20||s.y>innerHeight+20){ o.el.style.display='none'; return; }
      o.pri=(o===selected?1000:0)+o.imp*3-Math.log10(o.dc+.01)*4; cand.push(o);
    });
    cand.sort((a,b)=>b.pri-a.pri);
  } else objects.forEach(o=>o.el.style.display='none');
  cand.forEach(o=>{
    const r={x:o.scr.x+8,y:o.scr.y-9,w:o.w||60,h:o.h||18};
    if(o!==selected && (overlaps(r,placed)||placed.length>36)){ o.el.style.display='none'; return; }
    placed.push(r); o.el.style.display=''; o.el.style.transform=`translate(${r.x}px,${r.y}px)`;
    o.el.classList.toggle('sel',o===selected);
  });
  RUNGS.forEach(g=>{
    if(!showLabels||!ringGroup.visible){ g.el.style.display='none'; return; }
    const s=screenOf(g.pos), dc=cp.distanceTo(g.pos), R=f(g.d);
    const r={x:s.x+4,y:s.y-6,w:g.w||50,h:g.h||14};
    if(s.z>1||dc>R*6+8||dc<R*.08||overlaps(r,placed)){ g.el.style.display='none'; return; }
    placed.push(r); g.el.style.display=''; g.el.style.transform=`translate(${r.x}px,${r.y}px)`;
  });
  updateReadout();
  requestAnimationFrame(frame);
}

addEventListener('resize',()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); });
document.addEventListener('pointerdown',e=>{ if(!e.target.closest('#searchWrap')) results.hidden=true; });

// initial: whole-universe overview, then ease toward the solar neighbourhood scale
camera.position.set(200,230,260); controls.target.set(0,0,0);
syncTimeUI();
selected=null;
requestAnimationFrame(frame);
setTimeout(()=>{ if(!fly && !tour.on) flyTo(new THREE.Vector3(), 150, 3200, new THREE.Vector3(.55,.62,.75)); }, 600);
})();
</script>
